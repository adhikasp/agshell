[package]
name = "agshell"
version = "0.2.0"
edition = "2024"
description = "A supervised execution shell for coding agents: per-command and per-stage exit status instead of one exit code per command string."
license = "MIT"
repository = "https://github.com/adhikasp/agshell"

[dependencies]
brush-core = "0.5"
brush-parser = "0.4"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
futures = "0.3"
brush-builtins = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
serde_json = "1"
