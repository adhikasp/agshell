[package]
name = "agshell"
version = "0.3.0"
edition = "2024"
description = "A supervised execution shell for coding agents: per-command and per-stage exit status instead of one exit code per command string."
license = "MIT"
repository = "https://github.com/adhikasp/agshell"

[lib]
name = "agshell"
path = "src/lib.rs"

[[bin]]
name = "agshell"
path = "src/main.rs"

[dependencies]
brush-builtins = "0.2"
brush-core = "0.5"
brush-parser = "0.4"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = "thin"

